<body>
    <div class="loading" style="background:var(--gradient-card);border:1px solid var(--border-default);border-radius:16px;padding:42px;min-width:300px;box-shadow:var(--shadow-glow-purple)">
        <div class="spinner"></div>
        <h3>Signing in...</h3>
        <p id="status">Connecting to Google...</p>
    </div>
    <script src="static/supabase_client.js"></script>
    <script>
        // Handle Supabase OAuth callback AND platform OAuth callbacks
        async function handleCallback() {
            const hash = window.location.hash;
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check if this is a platform OAuth callback (LinkedIn, GitHub, Indeed)
            const platform = urlParams.get('platform');
            const state = urlParams.get('state');
            
            if (platform) {
                // This is a platform OAuth callback — redirect to serverless handler
                document.getElementById('status').textContent = `Connecting to ${platform}...`;
                const baseUrl = window.location.origin;
                const redirectUri = encodeURIComponent(`${baseUrl}/auth_callback.html`);
                window.location.href = `${baseUrl}/api/oauth/callback?platform=${platform}&redirect_uri=${redirectUri}&${window.location.search}`;
                return;
            }
            
            // Supabase auth callback
            if (!hash || !hash.includes('access_token')) {
                document.getElementById('status').textContent = 'Error: No token received';
                setTimeout(() => window.location.href = '/', 3000);
                return;
            }

            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const expiresIn = params.get('expires_in');

            if (!accessToken) {
                document.getElementById('status').textContent = 'Error: Invalid token';
                setTimeout(() => window.location.href = '/', 3000);
                return;
            }

            // Save the Supabase session
            localStorage.setItem('supabase_token', accessToken);
            if (refreshToken) {
                localStorage.setItem('supabase_refresh_token', refreshToken);
            }

            // Fetch user info from Supabase
            try {
                const resp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${accessToken}`,
                    },
                });

                if (resp.ok) {
                    const user = await resp.json();
                    localStorage.setItem('supabase_user', JSON.stringify(user));
                    document.getElementById('status').textContent = 'Success! Redirecting...';
                } else {
                    throw new Error('Failed to fetch user info');
                }
            } catch (err) {
                console.error('Error fetching user:', err);
                document.getElementById('status').textContent = 'Signed in! Redirecting...';
            }

            // Clear the hash and redirect to home page
            window.location.hash = '';

            // Send token back to opener (popup flow) or redirect
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'supabase-auth-token',
                    token: accessToken,
                    user: localStorage.getItem('supabase_user') ? JSON.parse(localStorage.getItem('supabase_user')) : null
                }, '*');
                window.close();
            } else {
                // Normal redirect flow (production)
                setTimeout(() => window.location.href = '/', 1000);
            }
        }

        handleCallback();
    </script>
</body>
